[project]
name = "labs"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "langdetect",
    "html5lib",
    "beautifulsoup4",
    "pillow",
    "numpy",
    "tool-eval-bench @ git+https://github.com/SeraphimSerapis/tool-eval-bench.git@6be685f0e6b9e0df05ed024848cf7fe1eca48752",
]

[project.scripts]
eval             = "eval.launch_eval:main"
model            = "eval.launch_model:main"
harness          = "eval.run_harness:main"
benchmark        = "eval.launch_benchmark:main"
create-harness   = "eval.create_harness:main"
trivia           = "eval.trivia_eval:main"
test-analyzer    = "eval.test_analyzer:main"

[tool.setuptools.packages.find]
include = ["eval*"]

[tool.uv]
package = true
